name: Prepare Harvest Hollow Windows review evidence
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful native Windows build run ID
        type: string
        required: true
permissions:
  actions: read
  contents: read
concurrency:
  group: harvest-hollow-review-${{ inputs.build_run_id }}
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Verify the exact successful Windows build
        shell: python
        run: |
          import json, os, re, subprocess
          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['BUILD_RUN_ID']
          assert re.fullmatch(r'[1-9][0-9]*', run_id), 'Invalid build run ID'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          workflow = api('repos/' + repository + '/actions/workflows/windows.yml')
          build = api('repos/' + repository + '/actions/runs/' + run_id)
          assert build['status'] == 'completed' and build['conclusion'] == 'success', 'Windows build did not complete successfully'
          assert build['workflow_id'] == workflow['id'], 'Run is not the native Windows build workflow'
          assert build['head_branch'] == 'main', 'Build must be from the release repository main branch'
          assert build['repository']['full_name'] == repository, 'Build belongs to another repository'
          assert build['head_repository']['full_name'] == repository, 'Build source belongs to another repository'
          artifacts = api('repos/' + repository + '/actions/runs/' + run_id + '/artifacts?per_page=100')
          matches = [artifact for artifact in artifacts['artifacts'] if artifact['name'] == 'harvest-hollow-windows-x64']
          assert len(matches) == 1 and not matches[0]['expired'], 'Exact Windows build artifact is missing or expired'
          print('Verified successful Windows build run ' + run_id)
      - name: Download the exact Windows build artifact in GitHub
        uses: actions/download-artifact@v4
        with:
          name: harvest-hollow-windows-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: native-artifact
      - name: Retain only captures, audio reports and verified metadata
        shell: python
        run: |
          import json, os, shutil
          from pathlib import Path
          artifact = Path('native-artifact')
          proofs = list(artifact.rglob('native-release-proof.json'))
          assert len(proofs) == 1, 'Windows artifact must contain exactly one native release proof'
          proof_file = proofs[0]
          proof = json.loads(proof_file.read_text(encoding='utf-8'))
          assert proof['schema_version'] == 1
          assert proof['name'] == 'Harvest Hollow'
          assert proof['distribution'] == 'native-windows-x64-installer'
          assert proof['source_repository'] == 'https://github.com/kevstermcgee/BlueEngine'
          assert proof['source_revision'] == 'c59dbfa2e25357428b09ec08d6c95130737dada8', 'Proof source differs from the reviewed game source'
          assert proof['build_status'] == 'success', 'Native release proof is not successful'
          expected_run = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['BUILD_RUN_ID']
          assert proof['build_run'] == expected_run, 'Proof belongs to another build run'
          checks = proof['checks']
          required = {'native_x64_gui', 'c_runtime_linked_into_game', 'native_launch', 'isolated_graphical_smoke', 'installation_upgrade_uninstall_and_save_retention', 'fullscreen_default', 'studio_card', 'fullscreen_toggle', 'explicit_windowed'}
          assert isinstance(checks, dict) and required <= checks.keys()
          assert all(value is True for value in checks.values()), 'A native verification check did not pass'
          game = proof_file.parent
          ship = game / 'dist/ship.json'
          assert ship.is_file(), 'Verified native package metadata is missing'
          stamp = json.loads(ship.read_text(encoding='utf-8'))
          assert stamp['verified']['launch'] and stamp['verified']['smoke']
          captures = sorted((game / '.blue-check').rglob('*.png'))
          reports = sorted((game / '.blue-check/audio').glob('*.json'))
          assert captures, 'Windows verification has no gameplay captures'
          assert len(reports) >= 4, 'Windows verification has incomplete soundtrack reports'
          evidence = Path('evidence')
          files = [proof_file, ship, *captures, *reports]
          total = 0
          for source in files:
              relative = source.relative_to(game)
              destination = evidence / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              total += source.stat().st_size
          print('Prepared ' + str(len(captures)) + ' Windows captures, ' + str(len(reports)) + ' audio reports, and unchanged native proof/package metadata; ' + str(total) + ' bytes total.')
      - name: Upload small Windows review evidence
        uses: actions/upload-artifact@v4
        with:
          name: harvest-hollow-review
          path: evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  startup:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the exact successful native package
        uses: actions/download-artifact@v4
        with:
          name: harvest-hollow-windows-x64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Prepare pinned software OpenGL
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa-ci.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa-ci'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695') { throw 'Mesa checksum mismatch' }
          & 7z x $archive "-o$mesa" 'x64/*' -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          "BE2_CI_OPENGL_DIR=$(Join-Path $mesa 'x64')" >> $env:GITHUB_ENV
      - name: Capture ready game content after normal fullscreen and windowed startup
        shell: pwsh
        run: |
          ./tools/check_startup_windows.ps1 -Executable candidate/dist/harvest-hollow.exe -ExpectedTitle 'Harvest Hollow' -OutputDirectory startup-evidence -OpenGLDirectory $env:BE2_CI_OPENGL_DIR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harvest-hollow-startup-evidence
          path: startup-evidence/
          if-no-files-found: warn
